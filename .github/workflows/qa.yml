name: QA

on:
  push:
    branches: [main]
  pull_request:

jobs:
  qa:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build

      - name: Start production server
        run: npm run start &

      - name: Wait for server
        run: npx wait-on http://localhost:3000

      - run: npm run qa:links
      - run: npm run qa:console
      - run: npm run qa:mobile
      - run: npm run qa:lighthouse
      # Uncomment once you've committed baseline screenshots (see Tier 4):
      # - run: npm run qa:visual
      # Uncomment once qa/e2e selectors match your real markup (see Tier 5):
      # - run: npm run qa:e2e

      - name: Upload QA reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-reports
          path: qa/reports
